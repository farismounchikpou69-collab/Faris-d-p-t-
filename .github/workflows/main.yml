name: Flutter CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze

      - name: Configurer les plateformes
        run: flutter create . --platforms web,android

      - name: Autoriser Internet (Android)
        run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Construire l'application Web
        run: flutter build web --release --base-href "/Infos-/" --dart-define=NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}

      - name: Construire l'APK
        run: flutter build apk --release --dart-define=NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}

      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "World AI News v1.${{ github.run_number }}" \
            --notes "APK Android généré automatiquement."

      - name: Préparer le site pour Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
