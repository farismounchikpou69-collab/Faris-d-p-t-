
name: World AI News - Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generer les fichiers Android
        run: flutter create --platforms=android --project-name world_ai_news .

      - name: Installer les dependances
        run: flutter pub get

      - name: Verifier le code
        run: flutter analyze

      - name: Nettoyer le projet
        run: flutter clean

      - name: Construire APK Android
        run: flutter build apk --release --dart-define=GNEWS_API_KEY=${{ secrets.GNEWS_API_KEY }}

      - name: Enregistrer APK
        uses: actions/upload-artifact@v4
        with:
          name: World-AI-News-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
